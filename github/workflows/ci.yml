name: AnomalyX CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: pytest test_features.py -v

      - name: Train model (smoke test)
        run: python MAIN/train_model.py

      - name: Run prediction on sample data (smoke test)
        run: echo "" | python MAIN/predict.py

      - name: Verify output charts were generated
        run: |
          test -f Sample_Output/1_fleet_risk_heatmap.png
          test -f Sample_Output/2_risk_timeline_top_device.png
          test -f Sample_Output/3_feature_importance.png
          test -f Sample_Output/4_sensor_trend_anomalies.png
          test -f Sample_Output/scored_results.csv
          echo "All expected output files were generated successfully."
